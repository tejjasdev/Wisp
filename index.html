<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Wisp</title>
    <meta name="description" content="A fast, lightweight player for HLS/IPTV playlists and internet radio. Runs entirely in your browser." />
    <meta name="theme-color" content="#191c22" />
    <meta name="color-scheme" content="dark" />
    <!-- Many stream CDNs reject requests that carry another site's Referer (hotlink
         protection) but accept ones with none, so Wisp never sends one. -->
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Paint the right background before any CSS/JS arrives. -->
    <style>html,body{background:#191c22;color:#e8ecf1;margin:0}</style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Wisp needs JavaScript to play streams.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
